(function(){const a=document.getElementById('bgm'),b=document.getElementById('musicBtn');a.volume=.42;let on=localStorage.getItem('kitsune_music_on')!=='0';function r(){b.textContent=on?'🎵 音乐：开':'🔇 音乐：关'}window.toggleMusic=function(){on=!on;localStorage.setItem('kitsune_music_on',on?'1':'0');if(on)a.play().catch(()=>{});else{a.pause();a.currentTime=0}r()};b.onclick=toggleMusic;['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{if(on)a.play().catch(()=>{})},{once:true}));r()})();
(async()=>{try{const t=await fetch('assets/data/game_01.txt').then(r=>r.text());const raw=atob(t);const u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);const js=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const patched=js.replaceAll('game.wave===20&&!player.unlocked.staff','game.wave===8&&!player.unlocked.staff').replaceAll('game.wave===40&&!player.unlocked.katana','game.wave===16&&!player.unlocked.katana');eval(patched)}catch(e){console.error(e);document.getElementById('startDesc').textContent='游戏代码加载失败：'+e.message}})();
